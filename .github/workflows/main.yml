name: Build Fro (Windows exe)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the exe to a GitHub Release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run logic tests
        run: python -m pytest tests -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Make the icon
        run: python tools/make_icon.py

      - name: Build Fro.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Fro `
            --icon assets/fro.ico `
            --collect-all speech_recognition `
            --collect-all edge_tts `
            --collect-all screen_brightness_control `
            --collect-data certifi `
            --collect-submodules pyttsx3 `
            --collect-submodules pycaw `
            --hidden-import pyttsx3.drivers.sapi5 `
            --hidden-import pythoncom `
            --hidden-import win32com.client `
            --hidden-import comtypes.stream `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            main.py

      - name: Smoke test the exe (does it start with every library bundled?)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Fro.exe -ArgumentList "--selftest" -Wait -PassThru
          $report = Join-Path $env:TEMP "fro_selftest.txt"
          if (Test-Path $report) { Get-Content $report } else { Write-Host "no selftest report found" }
          if ($p.ExitCode -ne 0) { throw "Selftest failed with exit code $($p.ExitCode)" }

      - name: Upload Fro.exe
        uses: actions/upload-artifact@v4
        with:
          name: Fro-Windows
          path: dist/Fro.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Fro.exe
          generate_release_notes: true
